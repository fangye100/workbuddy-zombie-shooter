<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Game Editor · 末日尸潮</title>
<style>
  :root {
    --ink: #14110F;
    --paper: #F5E7C8;
    --bone: #FFF6E2;
    --night: #171327;
    --night-deep: #0E0C16;
    --zombie: #8FD14F;
    --blood: #E8402A;
    --warn: #FFC531;
    --teal: #2BC4D6;
    --toxic: #9B5DE5;
    --gold: #FF9F1C;
    --panel: #221E33;
    --panel-deep: #0A0812;
    --text-dim: #9AA0A6;
    --stroke: 4px;
    /* 三栏 + 底部 dock 的尺寸变量：拖拽分界线只改这四个值，布局全靠 var() 引用 */
    --panel-w: 330px;
    --insp-w: 300px;
    --dock-h: 260px;
    --tree-w: 210px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--night-deep);
    color: var(--paper);
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    display: flex;
  }
  /* 中央列 = 画布 + 底部资产库 dock；画布吃满剩余高度 */
  #center { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  canvas#gpu { display: block; width: 100%; flex: 1 1 auto; min-height: 0; background: #000; touch-action: none; }

  .panel {
    width: var(--panel-w);
    flex: 0 0 var(--panel-w);
    height: 100%;
    overflow-y: auto;
    background: var(--panel-deep);
    padding-bottom: 40px;
  }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-thumb { background: var(--panel); border-radius: 4px; }

  .brand {
    padding: 14px 16px 12px;
    border-bottom: var(--stroke) solid var(--ink);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--bone);
  }
  .brand h1 em { color: var(--zombie); font-style: normal; }
  .brand p { font-size: 11px; color: var(--text-dim); margin-top: 3px; line-height: 1.5; }

  .group { border-bottom: 2px solid var(--ink); }
  .group > summary {
    padding: 9px 16px;
    background: var(--panel);
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    list-style: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before {
    content: "+";
    display: inline-block;
    width: 12px;
    color: var(--zombie);
    font-weight: 700;
  }
  .group[open] > summary::before { content: "-"; }
  .group-body { padding: 10px 16px 14px; }

  .row { margin-bottom: 11px; }
  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .row-head label { font-size: 12px; color: var(--paper); }
  .row-head .val {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--warn);
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 10px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }

  input[type=range] {
    width: 100%;
    height: 16px;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 5px;
    background: var(--panel);
    border: 1px solid var(--ink);
    border-radius: 3px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    margin-top: -5px;
    background: var(--zombie);
    border: 2px solid var(--ink);
    border-radius: 50%;
  }
  input[type=range]::-moz-range-track {
    height: 5px; background: var(--panel);
    border: 1px solid var(--ink); border-radius: 3px;
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px;
    background: var(--zombie); border: 2px solid var(--ink); border-radius: 50%;
  }

  input[type=color] {
    width: 100%;
    height: 26px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--panel);
    cursor: pointer;
    padding: 1px;
  }
  select {
    width: 100%;
    height: 26px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { display: none; }
  .toggle .box {
    width: 34px; height: 18px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 9px;
    position: relative;
    flex: 0 0 34px;
    transition: background .12s;
  }
  .toggle .box::after {
    content: "";
    position: absolute;
    top: 1px; left: 1px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform .12s, background .12s;
  }
  .toggle input:checked + .box { background: var(--zombie); }
  .toggle input:checked + .box::after { transform: translateX(16px); background: var(--ink); }

  .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto;
    min-width: 76px;
    padding: 7px 9px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: var(--zombie); color: var(--ink); }
  button:active { transform: translate(1px, 1px); }
  button.accent { background: var(--warn); color: var(--ink); }

  canvas.curve {
    width: 100%;
    height: 96px;
    border: 2px solid var(--ink);
    border-radius: 5px;
    background: var(--panel);
    display: block;
    margin-bottom: 6px;
  }
  .curve-cap { font-size: 10px; color: var(--text-dim); margin-bottom: 9px; }

  #hud {
    position: fixed;
    right: calc(var(--insp-w) + 18px);
    top: 12px;
    background: rgba(10, 8, 18, 0.86);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 8px 11px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--zombie);
    pointer-events: none;
    min-width: 168px;
  }
  #hud b { color: var(--paper); font-weight: 400; }
  #hud .warn { color: var(--blood); }

  #fatal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--night-deep);
    padding: 40px;
    z-index: 100;
  }
  #fatal .card {
    max-width: 560px;
    background: var(--panel);
    border: var(--stroke) solid var(--blood);
    border-radius: 12px;
    padding: 26px 30px;
  }
  #fatal h2 { color: var(--blood); font-size: 19px; margin-bottom: 12px; }
  #fatal p { line-height: 1.75; color: var(--paper); margin-bottom: 9px; }
  #fatal code {
    background: var(--night-deep);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--warn);
  }

  /* ---- 场景层级 Hierarchy ---- */
  .hier-summary { font-size: 10px; color: var(--text-dim); margin-bottom: 7px; }
  .hier-cat { margin-bottom: 6px; }
  .hier-cat > summary {
    cursor: pointer;
    user-select: none;
    font-size: 11px;
    font-weight: 700;
    color: var(--zombie);
    padding: 3px 0;
    list-style: none;
  }
  .hier-cat > summary::-webkit-details-marker { display: none; }
  .hier-cat > summary::before { content: "-"; display: inline-block; width: 11px; }
  .hier-cat:not([open]) > summary::before { content: "+"; }
  .hier-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 5px;
    margin: 1px 0 1px 11px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .hier-row:hover { background: var(--panel); }
  .hier-row.sel { background: var(--warn); border-color: var(--ink); }
  .hier-row.sel .hier-name, .hier-row.sel .hier-meta { color: var(--ink); }
  .hier-row.hidden .hier-name { color: var(--text-dim); text-decoration: line-through; }
  .hier-name {
    flex: 1 1 auto;
    font-size: 12px;
    color: var(--paper);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hier-meta {
    flex: 0 0 auto;
    font-size: 10px;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--text-dim);
  }
  /* 子网格（mesh）节点：缩进一级 + 小一号字 + 材质名徽章 */
  .hier-kids { display: flex; flex-direction: column; }
  .hier-row.hier-sub { margin-left: 30px; padding: 2px 5px; }
  .hier-row.hier-sub .hier-name { font-size: 11px; color: #C9CDD4; }
  .hier-row.hier-sub.sel .hier-name { color: var(--ink); }
  /* GLB 组节点（父子层级还原）：淡色小字 + 整行点击折叠，无眼睛/删除/材质徽章 */
  .hier-row.hier-grp { padding: 2px 5px; cursor: pointer; }
  .hier-row.hier-grp .hier-name { font-size: 11px; color: var(--text-dim); letter-spacing: 0.02em; }
  .hier-row.hier-grp:hover .hier-name { color: #C9CDD4; }
  .hier-mat {
    flex: 0 1 auto;
    max-width: 96px;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-dim);
    border: 1px solid transparent;
  }
  .hier-mat.shared { color: #C9CDD4; }
  .hier-mat.instance { color: var(--ink); background: var(--teal); }
  .hier-mat.override { color: var(--ink); background: var(--warn); }
  .hier-row.sel .hier-mat.instance, .hier-row.sel .hier-mat.override { border-color: var(--ink); }
  .hier-tw {
    flex: 0 0 auto;
    min-width: 0;
    width: 14px;
    padding: 0;
    background: transparent;
    border: none;
    color: var(--zombie);
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
  }
  .hier-row.sel .hier-tw { color: var(--ink); }

  /* ---- Mesh 材质（材质槽编辑）---- */
  .mm-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    margin-bottom: 9px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 5px;
  }
  .mm-target {
    font-size: 12px;
    font-weight: 700;
    color: var(--bone);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mm-badge {
    flex: 0 0 auto;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 7px;
    border: 1px solid var(--ink);
  }
  .mm-badge.shared { background: rgba(255, 255, 255, 0.1); color: var(--text-dim); }
  .mm-badge.instance { background: var(--teal); color: var(--ink); }
  .mm-badge.override { background: var(--warn); color: var(--ink); }
  .mm-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 26px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 7px;
    font-size: 12px;
    font-family: inherit;
  }
  .mm-input:disabled { opacity: 0.45; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { background: var(--panel); color: var(--paper); }

  .hier-eye, .hier-del {
    flex: 0 0 auto;
    min-width: 0;
    padding: 1px 4px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .hier-eye:hover { color: var(--zombie); }
  .hier-del:hover { color: var(--blood); }
  .hier-row.sel .hier-eye, .hier-row.sel .hier-del { color: var(--ink); }
  .hier-row.sel .hier-eye:hover, .hier-row.sel .hier-del:hover { color: var(--blood); }

  /* ---- Transform Gizmo 顶部工具栏（Unity 风格）---- */
  #gizmo-bar {
    position: fixed;
    top: 12px;
    left: calc(var(--panel-w) + 22px);
    right: auto;
    display: flex;
    justify-content: flex-start;
    pointer-events: none;
    z-index: 20;
  }
  #gizmo-bar .gz-inner {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(10, 8, 18, 0.92);
    border: var(--stroke) solid var(--ink);
    border-radius: 9px;
    padding: 5px 8px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
  #gizmo-bar .gz-group { display: flex; gap: 4px; }
  #gizmo-bar .gz-sep { width: 2px; height: 22px; background: var(--ink); margin: 0 3px; }
  #gizmo-bar .gz-btn {
    flex: 0 0 auto;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 9px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 5px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  #gizmo-bar .gz-btn svg { width: 15px; height: 15px; display: block; fill: currentColor; }
  #gizmo-bar .gz-btn:hover { background: var(--zombie); color: var(--ink); }
  #gizmo-bar .gz-btn:active { transform: translate(1px, 1px); }
  #gizmo-bar .gz-btn.active { color: var(--ink); }
  #gizmo-bar .gz-btn.active[data-mode="translate"] { background: var(--blood); color: #fff; }
  #gizmo-bar .gz-btn.active[data-mode="rotate"] { background: var(--zombie); }
  #gizmo-bar .gz-btn.active[data-mode="scale"] { background: var(--teal); }
  #gizmo-bar .gz-btn.active[data-space] { background: var(--warn); }

  /* ================= 可拖拽分界线（所有面板边界都不锁死） ================= */
  .split-handle {
    flex: 0 0 6px;
    background: var(--ink);
    cursor: col-resize;
    z-index: 30;
    transition: background .12s;
  }
  .split-handle:hover, .split-handle.dragging { background: var(--zombie); }
  body.splitting { user-select: none; }
  body.splitting canvas { pointer-events: none; }

  /* ================= 资产库 Asset Library（底部 dock） ================= */
  #asset-dock {
    height: var(--dock-h);
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--panel-deep);
    min-height: 0;
  }
  #asset-dock.collapsed { height: auto; }
  #asset-dock.collapsed .ad-body, #asset-dock.collapsed .ad-grip { display: none; }
  .ad-grip { flex: 0 0 6px; height: 6px; background: var(--ink); cursor: row-resize; transition: background .12s; }
  .ad-grip:hover, .ad-grip.dragging { background: var(--zombie); }
  .ad-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 3px solid var(--ink);
  }
  .ad-title { font-weight: 700; font-size: 13px; color: var(--bone); white-space: nowrap; }
  .ad-title em { color: var(--zombie); font-style: normal; font-size: 11px; }
  .ad-crumb {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 11px;
    color: var(--text-dim);
  }
  .ad-cseg { cursor: pointer; color: var(--teal); }
  .ad-cseg:hover { text-decoration: underline; }
  .ad-csep { margin: 0 3px; }
  .ad-filter {
    flex: 0 0 150px;
    height: 24px;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 7px;
    font-size: 11px;
    font-family: inherit;
  }
  .ad-head .ad-zoom { width: 110px; flex: 0 0 110px; }
  .ad-zoom-label { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .ad-collapse { flex: 0 0 auto; min-width: 0; padding: 3px 10px; }
  .ad-body { flex: 1 1 auto; display: flex; min-height: 0; }
  .ad-tree {
    width: var(--tree-w);
    flex: 0 0 var(--tree-w);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 4px;
  }
  .ad-tree::-webkit-scrollbar, .ad-content::-webkit-scrollbar, .insp-pane::-webkit-scrollbar { width: 8px; }
  .ad-tree::-webkit-scrollbar-thumb, .ad-content::-webkit-scrollbar-thumb, .insp-pane::-webkit-scrollbar-thumb { background: var(--panel); border-radius: 4px; }
  .ad-split { flex: 0 0 6px; background: var(--ink); cursor: col-resize; transition: background .12s; }
  .ad-split:hover, .ad-split.dragging { background: var(--zombie); }
  .ad-content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--ad-cell, 110px), 1fr));
    gap: 5px;
    align-content: start;
  }
  .ad-content.list { display: block; padding: 4px 0; }
  .ad-empty { grid-column: 1 / -1; padding: 20px; text-align: center; color: var(--text-dim); font-size: 11px; }

  /* 目录树节点 */
  .ad-tnode {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px 3px 0;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .ad-tnode:hover { background: var(--panel); }
  .ad-tnode.sel { background: var(--warn); border-color: var(--ink); }
  .ad-tnode.sel .ad-tname, .ad-tnode.sel .ad-tarrow { color: var(--ink); }
  .ad-tarrow { flex: 0 0 12px; text-align: center; color: var(--zombie); font-size: 10px; cursor: pointer; }
  .ad-tico { flex: 0 0 14px; display: flex; }
  .ad-tico svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  .ad-tname { font-size: 12px; color: var(--paper); overflow: hidden; text-overflow: ellipsis; }

  /* 图标网格单元格 */
  .ad-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    min-width: 0;
  }
  .ad-item:hover { background: var(--panel); }
  .ad-item.sel { background: var(--warn); border-color: var(--ink); color: var(--ink); }
  .ad-item.sel .ad-name { color: var(--ink); }
  .ad-ico { width: 72%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .ad-ico svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.45)); }
  .ad-ico img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: repeating-conic-gradient(#2A2540 0 25%, #1A1628 0 50%) 0 0 / 16px 16px;
  }
  .ad-name {
    font-size: 11px;
    color: var(--paper);
    text-align: center;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-width: 100%;
  }

  /* 列表视图行 */
  .ad-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 10px;
    cursor: pointer;
    border: 1px solid transparent;
    font-size: 12px;
  }
  .ad-row:hover { background: var(--panel); }
  .ad-row.sel { background: var(--warn); border-color: var(--ink); color: var(--ink); }
  .ad-row.sel .ad-rname-t, .ad-row.sel .ad-rsize, .ad-row.sel .ad-rtime { color: var(--ink); }
  .ad-lhead { color: var(--text-dim); font-size: 10px; border-bottom: 2px solid var(--ink); cursor: default; padding: 4px 10px; }
  .ad-lhead:hover { background: transparent; }
  .ad-rname { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .ad-rname-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--paper); }
  .ad-ric { flex: 0 0 14px; display: flex; }
  .ad-ric svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  .ad-rsize { flex: 0 0 76px; text-align: right; color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 10px; }
  .ad-rtime { flex: 0 0 108px; text-align: right; color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 10px; }

  /* 资产类型配色（图标吃 currentColor） */
  .adk-dir { color: var(--warn); }
  .adk-model { color: var(--teal); }
  .adk-image { color: var(--zombie); }
  .adk-json { color: var(--toxic); }
  .adk-script { color: var(--blood); }
  .adk-doc { color: var(--paper); }
  .adk-audio { color: var(--gold); }
  .adk-font { color: var(--bone); }
  .adk-archive, .adk-file { color: var(--text-dim); }
  .ad-item.sel, .ad-row.sel, .ad-tnode.sel { color: var(--ink); }

  /* ================= 右侧属性 Inspector ================= */
  #inspector {
    width: var(--insp-w);
    flex: 0 0 var(--insp-w);
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel-deep);
    min-height: 0;
  }
  /* ---- 右侧属性 Inspector：Tab 栏 + 分页（检视 / 场景光照 / 渲染 / 资产）---- */
  .insp-tabs {
    display: flex;
    flex: 0 0 auto;
    background: var(--panel);
    border-bottom: 3px solid var(--ink);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .insp-tab {
    flex: 1 1 0;
    min-width: 0;
    padding: 9px 2px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    border-radius: 0;
    border-right: 1px solid var(--ink);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .insp-tab:last-child { border-right: none; }
  .insp-tab:hover { background: var(--panel-deep); color: var(--paper); }
  .insp-tab.active { background: var(--zombie); color: var(--ink); }
  .insp-panes { flex: 1 1 auto; min-height: 0; position: relative; }
  .insp-pane {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    display: none;
    padding-bottom: 40px;
  }
  .insp-pane.active { display: block; }
  .ai-head { padding: 10px 14px; background: var(--panel); border-bottom: 3px solid var(--ink); position: sticky; top: 0; z-index: 5; }
  .ai-title { font-size: 14px; font-weight: 700; color: var(--bone); }
  .ai-title em { color: var(--zombie); font-style: normal; font-size: 11px; }
  .ai-empty { padding: 30px 18px; color: var(--text-dim); font-size: 11px; line-height: 1.9; text-align: center; }
  .ai-hero { display: flex; align-items: center; gap: 9px; padding: 12px 14px 6px; }
  .ai-ico { flex: 0 0 30px; display: flex; }
  .ai-ico svg { width: 30px; height: 30px; fill: currentColor; display: block; }
  .ai-name { font-size: 13px; font-weight: 700; color: var(--bone); word-break: break-all; }
  .ai-rows { padding: 2px 14px 6px; }
  .ai-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 11px; }
  .ai-row span { color: var(--text-dim); flex: 0 0 auto; }
  .ai-row b { color: var(--paper); font-weight: 400; text-align: right; word-break: break-all; min-width: 0; }
  .ai-sub { font-size: 10px; color: var(--text-dim); padding: 2px 0 2px 10px; }
  .ai-sub i { font-style: normal; color: var(--warn); }
  .ai-extra { padding-bottom: 24px; }
  .ai-preview {
    margin: 10px 14px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: repeating-conic-gradient(#2A2540 0 25%, #1A1628 0 50%) 0 0 / 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    max-height: 200px;
  }
  .ai-preview img { max-width: 100%; max-height: 196px; object-fit: contain; display: block; }
  .ai-spawn { margin: 8px 14px 4px; width: calc(100% - 28px); }
  .ai-dim { margin: 4px 14px; font-size: 10px; color: var(--text-dim); line-height: 1.6; }
  .ai-text {
    margin: 8px 14px;
    padding: 8px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 5px;
    font-size: 10px;
    line-height: 1.55;
    color: #C9CDD4;
    white-space: pre;
    overflow: auto;
    max-height: 280px;
  }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="brand">
    <h1>Aether <em>Game Editor</em></h1>
    <p>末日尸潮 · 关卡物件编辑器<br>轻点选中 · 拖拽/单指环绕 · 右键/双指平移 · 滚轮/捏合缩放</p>
  </div>
  <div id="groups"></div>
</div>
<div class="split-handle" id="split-left" title="拖拽调整左侧面板宽度"></div>
<div id="center">
  <canvas id="gpu"></canvas>
  <div id="asset-dock"></div>
</div>
<div class="split-handle" id="split-right" title="拖拽调整属性面板宽度"></div>
<aside id="inspector">
  <div class="insp-tabs">
    <button class="insp-tab active" data-tab="inspector">检视</button>
    <button class="insp-tab" data-tab="scene">场景/光照</button>
    <button class="insp-tab" data-tab="render">渲染</button>
    <button class="insp-tab" data-tab="asset">资产</button>
  </div>
  <div class="insp-panes">
    <div class="insp-pane active" data-pane="inspector"></div>
    <div class="insp-pane" data-pane="scene"></div>
    <div class="insp-pane" data-pane="render"></div>
    <div class="insp-pane" data-pane="asset"></div>
  </div>
</aside>

<div id="gizmo-bar">
  <div class="gz-inner">
    <div class="gz-group">
      <button class="gz-btn gz-mode" data-mode="translate" title="移动 (W)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l4 4h-3v4h6V7l4 4-4 4v-3h-6v6h3l-4 4-4-4h3v-6H5v3l-4-4 4-4v3h6V6H8z"/></svg>
        移动 W
      </button>
      <button class="gz-btn gz-mode" data-mode="rotate" title="旋转 (E)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.32 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M5 3l1.2 4.4L10 8z"/></svg>
        旋转 E
      </button>
      <button class="gz-btn gz-mode" data-mode="scale" title="缩放 (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h2v2H8zM14 8h2v2h-2zM8 14h2v2H8zM14 14h2v2h-2zM10 10h4v4h-4z"/></svg>
        缩放 R
      </button>
    </div>
    <div class="gz-sep"></div>
    <div class="gz-group">
      <button class="gz-btn gz-space" data-space="world" title="世界坐标">World</button>
      <button class="gz-btn gz-space" data-space="local" title="局部坐标">Local</button>
    </div>
  </div>
</div>

<div id="hud"></div>

<div id="fatal">
  <div class="card">
    <h2 id="fatal-title">无法启动</h2>
    <div id="fatal-body"></div>
  </div>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
