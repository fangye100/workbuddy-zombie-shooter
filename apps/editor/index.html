<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="XXO9YJxl6n3UGOPbVhCxsx">
<head data-page-node-id="9rrMyCu50aotildlwpb3Px">
<meta charset="UTF-8" data-page-node-id="foeH2nAegwlSZ0gR18YgyE">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" data-page-node-id="1arz6knwqRPi7le88bCFwM">
<title>Web3D Editor</title>
<style>
  :root {
    --ink: #14110F;
    --paper: #F5E7C8;
    --bone: #FFF6E2;
    --night: #171327;
    --night-deep: #0E0C16;
    --zombie: #8FD14F;
    --blood: #E8402A;
    --warn: #FFC531;
    --teal: #2BC4D6;
    --toxic: #9B5DE5;
    --gold: #FF9F1C;
    --panel: #221E33;
    --panel-deep: #0A0812;
    --text-dim: #9AA0A6;
    --stroke: 4px;
    /* 三栏 + 底部 dock 的尺寸变量：拖拽分界线只改这四个值，布局全靠 var() 引用 */
    --panel-w: 330px;
    --insp-w: 300px;
    --dock-h: 260px;
    --tree-w: 210px;
    --topbar-h: 40px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--night-deep);
    color: var(--paper);
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  /* 中央列 = 画布（+ 绑定/重定向浮层）；资产库 dock 已提出本列，挂到 mainrow 的 grid 第二行 */
  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  canvas#gpu { display: block; width: 100%; flex: 1 1 auto; min-height: 0; background: #000; touch-action: none; }

  .panel {
    overflow-y: auto; /* 层级列变矮后内容用滚动条显示（下边缘止于资产库上缘） */
    background: var(--panel-deep);
    padding-bottom: 40px;
  }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-thumb { background: var(--panel); border-radius: 4px; }
  .group { border-bottom: 2px solid var(--ink); }
  .group > summary {
    padding: 9px 16px;
    background: var(--panel);
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    list-style: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before {
    content: "+";
    display: inline-block;
    width: 12px;
    color: var(--zombie);
    font-weight: 700;
  }
  .group[open] > summary::before { content: "-"; }
  .group-body { padding: 10px 16px 14px; }

  .row { margin-bottom: 11px; }
  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .row-head label { font-size: 12px; color: var(--paper); }
  .row-head .val {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--warn);
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 10px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }

  /* 数字赋值框（检视页变换等精确输入）：面板深底 + 墨线描边，3 位小数 step */
  input[type=number] {
    width: 100%;
    height: 22px;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 6px;
    font-size: 11px;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  input[type=number]:focus { outline: none; border-color: var(--zombie); }
  input[type=number]::-webkit-inner-spin-button { opacity: .5; }

  input[type=range] {
    width: 100%;
    height: 16px;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 5px;
    background: var(--panel);
    border: 1px solid var(--ink);
    border-radius: 3px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    margin-top: -5px;
    background: var(--zombie);
    border: 2px solid var(--ink);
    border-radius: 50%;
  }
  input[type=range]::-moz-range-track {
    height: 5px; background: var(--panel);
    border: 1px solid var(--ink); border-radius: 3px;
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px;
    background: var(--zombie); border: 2px solid var(--ink); border-radius: 50%;
  }

  input[type=color] {
    width: 100%;
    height: 26px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--panel);
    cursor: pointer;
    padding: 1px;
  }
  select {
    width: 100%;
    height: 26px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { display: none; }
  .toggle .box {
    width: 34px; height: 18px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 9px;
    position: relative;
    flex: 0 0 34px;
    transition: background .12s;
  }
  .toggle .box::after {
    content: "";
    position: absolute;
    top: 1px; left: 1px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform .12s, background .12s;
  }
  .toggle input:checked + .box { background: var(--zombie); }
  .toggle input:checked + .box::after { transform: translateX(16px); background: var(--ink); }

  .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto;
    min-width: 76px;
    padding: 7px 9px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: var(--zombie); color: var(--ink); }
  button:active { transform: translate(1px, 1px); }
  button.accent { background: var(--warn); color: var(--ink); }

  canvas.curve {
    width: 100%;
    height: 96px;
    border: 2px solid var(--ink);
    border-radius: 5px;
    background: var(--panel);
    display: block;
    margin-bottom: 6px;
  }
  .curve-cap { font-size: 10px; color: var(--text-dim); margin-bottom: 9px; }

  #hud {
    position: fixed;
    right: calc(var(--insp-w) + 18px);
    top: calc(var(--topbar-h, 40px) + 12px);
    background: rgba(10, 8, 18, 0.86);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 8px 11px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--zombie);
    pointer-events: none;
    min-width: 168px;
  }
  #hud b { color: var(--paper); font-weight: 400; }
  #hud .warn { color: var(--blood); }

  #fatal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--night-deep);
    padding: 40px;
    z-index: 100;
  }
  #fatal .card {
    max-width: 560px;
    background: var(--panel);
    border: var(--stroke) solid var(--blood);
    border-radius: 12px;
    padding: 26px 30px;
  }
  #fatal h2 { color: var(--blood); font-size: 19px; margin-bottom: 12px; }
  #fatal p { line-height: 1.75; color: var(--paper); margin-bottom: 9px; }
  #fatal code {
    background: var(--night-deep);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--warn);
  }

  /* ---- 场景层级 Hierarchy ---- */
  .hier-summary { font-size: 10px; color: var(--text-dim); margin-bottom: 7px; }
  .hier-cat { margin-bottom: 6px; }
  .hier-cat > summary {
    cursor: pointer;
    user-select: none;
    font-size: 11px;
    font-weight: 700;
    color: var(--zombie);
    padding: 3px 0;
    list-style: none;
  }
  .hier-cat > summary::-webkit-details-marker { display: none; }
  .hier-cat > summary::before { content: "-"; display: inline-block; width: 11px; }
  .hier-cat:not([open]) > summary::before { content: "+"; }
  .hier-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 5px;
    margin: 1px 0 1px 11px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .hier-row:hover { background: var(--panel); }
  .hier-row.sel { background: var(--warn); border-color: var(--ink); }
  .hier-row.sel .hier-name, .hier-row.sel .hier-meta { color: var(--ink); }
  .hier-row.hidden .hier-name { color: var(--text-dim); text-decoration: line-through; }
  .hier-name {
    flex: 1 1 auto;
    font-size: 12px;
    color: var(--paper);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hier-meta {
    flex: 0 0 auto;
    font-size: 10px;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--text-dim);
  }
  /* 子网格（mesh）节点：缩进一级 + 小一号字 + 材质名徽章 */
  .hier-kids { display: flex; flex-direction: column; }
  .hier-row.hier-sub { margin-left: 30px; padding: 2px 5px; }
  .hier-row.hier-sub .hier-name { font-size: 11px; color: #C9CDD4; }
  .hier-row.hier-sub.sel .hier-name { color: var(--ink); }
  /* GLB 组节点（父子层级还原）：淡色小字 + 整行点击折叠，无眼睛/删除/材质徽章 */
  .hier-row.hier-grp { padding: 2px 5px; cursor: pointer; }
  .hier-row.hier-grp .hier-name { font-size: 11px; color: var(--text-dim); letter-spacing: 0.02em; }
  .hier-row.hier-grp:hover .hier-name { color: #C9CDD4; }
  .hier-mat {
    flex: 0 1 auto;
    max-width: 96px;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-dim);
    border: 1px solid transparent;
  }
  .hier-mat.shared { color: #C9CDD4; }
  .hier-mat.instance { color: var(--ink); background: var(--teal); }
  .hier-mat.override { color: var(--ink); background: var(--warn); }
  .hier-row.sel .hier-mat.instance, .hier-row.sel .hier-mat.override { border-color: var(--ink); }
  .hier-tw {
    flex: 0 0 auto;
    min-width: 0;
    width: 14px;
    padding: 0;
    background: transparent;
    border: none;
    color: var(--zombie);
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
  }
  .hier-row.sel .hier-tw { color: var(--ink); }

  /* ---- Mesh 材质（材质槽编辑）---- */
  .mm-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    margin-bottom: 9px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 5px;
  }
  .mm-target {
    font-size: 12px;
    font-weight: 700;
    color: var(--bone);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mm-badge {
    flex: 0 0 auto;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 7px;
    border: 1px solid var(--ink);
  }
  .mm-badge.shared { background: rgba(255, 255, 255, 0.1); color: var(--text-dim); }
  .mm-badge.instance { background: var(--teal); color: var(--ink); }
  .mm-badge.override { background: var(--warn); color: var(--ink); }
  .mm-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 26px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 7px;
    font-size: 12px;
    font-family: inherit;
  }
  .mm-input:disabled { opacity: 0.45; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { background: var(--panel); color: var(--paper); }

  .hier-eye, .hier-del {
    flex: 0 0 auto;
    min-width: 0;
    padding: 1px 4px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .hier-eye:hover { color: var(--zombie); }
  .hier-del:hover { color: var(--blood); }
  .hier-row.sel .hier-eye, .hier-row.sel .hier-del { color: var(--ink); }
  .hier-row.sel .hier-eye:hover, .hier-row.sel .hier-del:hover { color: var(--blood); }

  /* ================= 顶部菜单栏 Top Menu（Skeleton ▸ 绑定） =================
   * 外壳层 UI：菜单项只调 main.ts 里既有的绑定入口（bindAssetAt / openBinding /
   * applyBinding / loadBvhForBinding / closeBinding），绑定逻辑仍在 services/binding。
   * 类名前缀 tb-，不是 ad-（同资产库那条注释，ad- 会被广告拦截插件 display:none）。 */
  #topbar {
    flex: 0 0 var(--topbar-h, 40px);
    height: var(--topbar-h, 40px);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: var(--stroke) solid var(--ink);
    z-index: 50;
  }
  .tb-brand { font-weight: 700; font-size: 14px; color: var(--bone); letter-spacing: 0.5px; white-space: nowrap; }
  .tb-brand em { color: var(--zombie); font-style: normal; }
  /* 顶栏状态行：原「模型预览」面板的 model-info 行迁来，接管全部 setModelInfo 反馈 */
  .tb-status {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 10px;
  }
  .tb-menus { display: flex; align-items: center; gap: 4px; }
  .tb-menu { position: relative; }
  .tb-btn {
    padding: 5px 12px;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 5px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .tb-btn:hover, .tb-menu.open .tb-btn { background: var(--zombie); color: var(--ink); }
  .tb-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 210px;
    display: flex;
    flex-direction: column;
    padding: 4px;
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0,0,0,.55);
    z-index: 60;
  }
  .tb-dropdown[hidden] { display: none; }
  .tb-item {
    padding: 7px 10px;
    font-size: 12px;
    color: var(--paper);
    background: none;
    border: 0;
    border-radius: 4px;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .tb-item:hover:not(:disabled) { background: var(--ink); color: var(--zombie); }
  .tb-item:disabled { color: var(--text-dim); cursor: default; }
  .tb-sep { height: 2px; background: var(--ink); margin: 4px 2px; }

  /* 主行改两行 grid（2026-09-23 布局改造）：
     行1 = 左栏(场景层级) | 左分隔条 | 画布 | 右分隔条 | Inspector
     行2 = 资产库 dock（从屏幕左缘横贯到 Inspector 前）
     → 场景层级下边缘 = 资产库上边缘；Inspector 通高；dock 行高随 --dock-h / 收起态自适应 */
  #mainrow {
    flex: 1 1 auto;
    display: grid;
    min-height: 0;
    width: 100%;
    grid-template-columns: var(--panel-w) 6px 1fr 6px var(--insp-w);
    grid-template-rows: minmax(0, 1fr) auto;
  }
  .panel { grid-area: 1 / 1; }
  #split-left { grid-area: 1 / 2; }
  #center { grid-area: 1 / 3; }
  #split-right { grid-area: 1 / 4; }
  #inspector { grid-area: 1 / 5 / 3 / 6; }
  #asset-dock { grid-area: 2 / 1 / 3 / 4; }

  /* ---- Transform Gizmo 顶部工具栏（Unity 风格）---- */
  #gizmo-bar {
    position: fixed;
    top: calc(var(--topbar-h, 40px) + 12px);
    left: calc(var(--panel-w) + 22px);
    right: auto;
    display: flex;
    justify-content: flex-start;
    pointer-events: none;
    z-index: 20;
  }
  #gizmo-bar .gz-inner {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(10, 8, 18, 0.92);
    border: var(--stroke) solid var(--ink);
    border-radius: 9px;
    padding: 5px 8px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
  #gizmo-bar .gz-group { display: flex; gap: 4px; }
  #gizmo-bar .gz-sep { width: 2px; height: 22px; background: var(--ink); margin: 0 3px; }
  #gizmo-bar .gz-btn {
    flex: 0 0 auto;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 9px;
    background: var(--panel);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 5px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  #gizmo-bar .gz-btn svg { width: 15px; height: 15px; display: block; fill: currentColor; }
  #gizmo-bar .gz-btn:hover { background: var(--zombie); color: var(--ink); }
  #gizmo-bar .gz-btn:active { transform: translate(1px, 1px); }
  #gizmo-bar .gz-btn.active { color: var(--ink); }
  #gizmo-bar .gz-btn.active[data-mode="translate"] { background: var(--blood); color: #fff; }
  #gizmo-bar .gz-btn.active[data-mode="rotate"] { background: var(--zombie); }
  #gizmo-bar .gz-btn.active[data-mode="scale"] { background: var(--teal); }
  #gizmo-bar .gz-btn.active[data-space] { background: var(--warn); }
  #gizmo-bar .gz-btn.active[data-xray] { background: var(--zombie); color: var(--ink); }
  /* Play 控制（WU-4）：播放中用尸绿高亮，暂停用警示黄，与 mode/space 的语义色区分开 */
  #gizmo-bar .gz-btn.active[data-play] { background: var(--zombie); color: var(--ink); }
  #gizmo-bar .gz-btn.active[data-play="pause"] { background: var(--warn); }
  #gizmo-bar .gz-btn:disabled { opacity: .35; cursor: not-allowed; }
  #gizmo-bar .gz-btn:disabled:hover { background: var(--panel); color: var(--paper); }
  #gizmo-bar .gz-btn:disabled:active { transform: none; }

  /* ---- Asset Preview Pane（资产页内 3D 预览 + Timeline）---- */
  .insp-pane[data-pane="asset"].active { display: flex; flex-direction: column; }
  .insp-pane[data-pane="asset"] .ai-host { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #asset-preview-host {
    flex: 0 0 auto;
    height: 360px;
    display: flex;
    flex-direction: column;
    border-top: 3px solid var(--ink);
    background: var(--panel-deep);
  }
  #asset-preview-host .ap-canvas { flex: 1 1 auto; width: 100%; min-height: 0; display: block; }
  #asset-preview-host .ap-panel { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; padding: 6px 8px; }
  #asset-preview-host .ap-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #asset-preview-host .ap-play,
  #asset-preview-host .ap-xray {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 26px; padding: 0 8px;
    background: var(--panel); color: var(--paper);
    border: 2px solid var(--ink); border-radius: 5px;
    font-size: 12px; font-weight: 700; cursor: pointer; user-select: none;
  }
  #asset-preview-host .ap-play:hover,
  #asset-preview-host .ap-xray:hover { background: var(--zombie); color: var(--ink); }
  #asset-preview-host .ap-xray.active { background: var(--zombie); color: var(--ink); }
  #asset-preview-host .ap-loop { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--paper); }
  #asset-preview-host .ap-clip, #asset-preview-host .ap-speed { height: 26px; font-size: 11px; }
  #asset-preview-host .ap-scrub { width: 100%; accent-color: var(--zombie); }
  #asset-preview-host .ap-time { font-size: 11px; text-align: center; color: var(--paper); }
  #asset-preview-host .ap-time .ap-t { color: var(--zombie); font-weight: 700; }

  /* ================= 可拖拽分界线（所有面板边界都不锁死） ================= */
  .split-handle {
    flex: 0 0 6px;
    background: var(--ink);
    cursor: col-resize;
    z-index: 30;
    transition: background .12s;
  }
  .split-handle:hover, .split-handle.dragging { background: var(--zombie); }
  body.splitting { user-select: none; }
  body.splitting canvas { pointer-events: none; }

  /* ================= 资产库 Asset Library（底部 dock） =================
   * ⚠️ 类名前缀是 asset-，不是 ad- —— 不要"简化"回去。
   * ad- 是 EasyList / uBlock Origin / AdGuard 的头号命中模式：本面板的
   * .ad-head / .ad-body / .ad-content / .ad-title / .ad-filter 会被注入
   * display:none !important，dock 只剩 6px 的 .ad-grip（"ad-grip" 不像广告词
   * 所以逃过一劫），表现为「资产库面板整片消失」。
   * 特征：无痕窗口正常（扩展默认禁用）、硬刷无效（扩展每次重新注入）、
   * DOM 里 dock 仍有 316px 高且 collapsed=false。
   * 同理文件类型色用 akind-（原 adk-），不用任何以 ad 开头的类名。
   * ==================================================================== */
  #asset-dock {
    height: var(--dock-h);
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--panel-deep);
    min-height: 0;
  }
  #asset-dock.collapsed { height: auto; }
  #asset-dock.collapsed .asset-body, #asset-dock.collapsed .asset-grip { display: none; }
  .asset-grip { flex: 0 0 6px; height: 6px; background: var(--ink); cursor: row-resize; transition: background .12s; }
  .asset-grip:hover, .asset-grip.dragging { background: var(--zombie); }
  .asset-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 3px solid var(--ink);
  }
  .asset-title { font-weight: 700; font-size: 13px; color: var(--bone); white-space: nowrap; }
  .asset-title em { color: var(--zombie); font-style: normal; font-size: 11px; }
  /* 返回上一层（与收起按钮同一套观感；到项目根后置灰） */
  .asset-up { flex: 0 0 auto; min-width: 0; padding: 3px 10px; font-weight: 700; }
  .asset-up:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  /* 行内重命名输入框（列表行 / 图标格子共用） */
  .asset-rename {
    width: 100%;
    min-width: 60px;
    height: 20px;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--zombie);
    border-radius: 4px;
    padding: 0 4px;
    font-size: 11px;
    font-family: inherit;
    outline: none;
  }
  .asset-crumb {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 11px;
    color: var(--text-dim);
  }
  .asset-cseg { cursor: pointer; color: var(--teal); }
  .asset-cseg:hover { text-decoration: underline; }
  .asset-csep { margin: 0 3px; }
  .asset-filter {
    flex: 0 0 150px;
    height: 24px;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 7px;
    font-size: 11px;
    font-family: inherit;
  }
  .asset-head .asset-zoom { width: 110px; flex: 0 0 110px; }
  .asset-zoom-label { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .asset-collapse { flex: 0 0 auto; min-width: 0; padding: 3px 10px; }
  .asset-body { flex: 1 1 auto; display: flex; min-height: 0; }
  .asset-tree {
    width: var(--tree-w);
    flex: 0 0 var(--tree-w);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 4px;
  }
  .asset-tree::-webkit-scrollbar, .asset-content::-webkit-scrollbar, .insp-pane::-webkit-scrollbar { width: 8px; }
  .asset-tree::-webkit-scrollbar-thumb, .asset-content::-webkit-scrollbar-thumb, .insp-pane::-webkit-scrollbar-thumb { background: var(--panel); border-radius: 4px; }
  .asset-split { flex: 0 0 6px; background: var(--ink); cursor: col-resize; transition: background .12s; }
  .asset-split:hover, .asset-split.dragging { background: var(--zombie); }
  .asset-content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--asset-cell, 110px), 1fr));
    gap: 5px;
    align-content: start;
  }
  .asset-content.list { display: block; padding: 4px 0; }
  .asset-empty { grid-column: 1 / -1; padding: 20px; text-align: center; color: var(--text-dim); font-size: 11px; }

  /* 目录树节点 */
  .asset-tnode {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px 3px 0;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .asset-tnode:hover { background: var(--panel); }
  .asset-tnode.sel { background: var(--warn); border-color: var(--ink); }
  .asset-tnode.sel .asset-tname, .asset-tnode.sel .asset-tarrow { color: var(--ink); }
  .asset-tarrow { flex: 0 0 12px; text-align: center; color: var(--zombie); font-size: 10px; cursor: pointer; }
  .asset-tico { flex: 0 0 14px; display: flex; }
  .asset-tico svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  .asset-tname { font-size: 12px; color: var(--paper); overflow: hidden; text-overflow: ellipsis; }

  /* 图标网格单元格 */
  .asset-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    min-width: 0;
  }
  .asset-item:hover { background: var(--panel); }
  .asset-item.sel { background: var(--warn); border-color: var(--ink); color: var(--ink); }
  .asset-item.sel .asset-name { color: var(--ink); }
  .asset-ico { width: 72%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .asset-ico svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.45)); }
  .asset-ico img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: repeating-conic-gradient(#2A2540 0 25%, #1A1628 0 50%) 0 0 / 16px 16px;
  }
  .asset-name {
    font-size: 11px;
    color: var(--paper);
    text-align: center;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-width: 100%;
  }

  /* 列表视图行 */
  .asset-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 10px;
    cursor: pointer;
    border: 1px solid transparent;
    font-size: 12px;
  }
  .asset-row:hover { background: var(--panel); }
  .asset-row.sel { background: var(--warn); border-color: var(--ink); color: var(--ink); }
  .asset-row.sel .asset-rname-t, .asset-row.sel .asset-rsize, .asset-row.sel .asset-rtime { color: var(--ink); }
  .asset-lhead { color: var(--text-dim); font-size: 10px; border-bottom: 2px solid var(--ink); cursor: default; padding: 4px 10px; }
  .asset-lhead:hover { background: transparent; }
  .asset-rname { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .asset-rname-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--paper); }
  .asset-ric { flex: 0 0 14px; display: flex; }
  .asset-ric svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  .asset-rsize { flex: 0 0 76px; text-align: right; color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 10px; }
  .asset-rtime { flex: 0 0 108px; text-align: right; color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 10px; }

  /* 资产类型配色（图标吃 currentColor） */
  .akind-dir { color: var(--warn); }
  .akind-model { color: var(--teal); }
  .akind-image { color: var(--zombie); }
  .akind-json { color: var(--toxic); }
  .akind-script { color: var(--blood); }
  .akind-doc { color: var(--paper); }
  .akind-audio { color: var(--gold); }
  .akind-font { color: var(--bone); }
  .akind-archive, .akind-file { color: var(--text-dim); }
  .asset-item.sel, .asset-row.sel, .asset-tnode.sel { color: var(--ink); }

  /* ================= 右侧属性 Inspector ================= */
  #inspector {
    width: var(--insp-w);
    flex: 0 0 var(--insp-w);
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel-deep);
    min-height: 0;
  }
  /* ---- 右侧属性 Inspector：Tab 栏 + 分页（检视 / 场景光照 / 渲染 / 资产）---- */
  .insp-tabs {
    display: flex;
    flex: 0 0 auto;
    background: var(--panel);
    border-bottom: 3px solid var(--ink);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .insp-tab {
    flex: 1 1 0;
    min-width: 0;
    padding: 9px 2px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    border-radius: 0;
    border-right: 1px solid var(--ink);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .insp-tab:last-child { border-right: none; }
  .insp-tab:hover { background: var(--panel-deep); color: var(--paper); }
  .insp-tab.active { background: var(--zombie); color: var(--ink); }
  .insp-panes { flex: 1 1 auto; min-height: 0; position: relative; }
  .insp-pane {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    display: none;
    padding-bottom: 40px;
  }
  .insp-pane.active { display: block; }
  .ai-head { padding: 10px 14px; background: var(--panel); border-bottom: 3px solid var(--ink); position: sticky; top: 0; z-index: 5; }
  .ai-title { font-size: 14px; font-weight: 700; color: var(--bone); }
  .ai-title em { color: var(--zombie); font-style: normal; font-size: 11px; }
  .ai-empty { padding: 30px 18px; color: var(--text-dim); font-size: 11px; line-height: 1.9; text-align: center; }
  .ai-hero { display: flex; align-items: center; gap: 9px; padding: 12px 14px 6px; }
  .ai-ico { flex: 0 0 30px; display: flex; }
  .ai-ico svg { width: 30px; height: 30px; fill: currentColor; display: block; }
  .ai-name { font-size: 13px; font-weight: 700; color: var(--bone); word-break: break-all; }
  .ai-rows { padding: 2px 14px 6px; }
  .ai-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 11px; }
  .ai-row span { color: var(--text-dim); flex: 0 0 auto; }
  .ai-row b { color: var(--paper); font-weight: 400; text-align: right; word-break: break-all; min-width: 0; }
  .ai-sub { font-size: 10px; color: var(--text-dim); padding: 2px 0 2px 10px; }
  .ai-sub i { font-style: normal; color: var(--warn); }
  .ai-extra { padding-bottom: 24px; }
  .ai-preview {
    margin: 10px 14px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: repeating-conic-gradient(#2A2540 0 25%, #1A1628 0 50%) 0 0 / 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    max-height: 200px;
  }
  .ai-preview img { max-width: 100%; max-height: 196px; object-fit: contain; display: block; }
  .ai-spawn { margin: 8px 14px 4px; width: calc(100% - 28px); }
  .ai-dim { margin: 4px 14px; font-size: 10px; color: var(--text-dim); line-height: 1.6; }
  .ai-text {
    margin: 8px 14px;
    padding: 8px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 5px;
    font-size: 10px;
    line-height: 1.55;
    color: #C9CDD4;
    white-space: pre;
    overflow: auto;
    max-height: 280px;
  }

  /* ================= 绑定面板 Binding（覆盖中央区域的全屏模式） =================
   * 进绑定 = 一种编辑模式：面板盖住 3D 视图，退出才回到场景，避免两个坐标系混看。
   * 顶边 bd-grip 可拖拽下压，露出上方 3D 视图对照（只改 --bind-top 一个值）。
   *
   * ⚠️ 类名前缀是 bd-，不是 ad- —— 同资产库那条注释：ad- 开头会被 EasyList /
   * uBlock Origin / AdGuard 注入 display:none !important，表现为「面板整片消失」。
   * ============================================================================ */
  #center { position: relative; } /* 绑定面板是它的绝对定位子层 */
  #binding-dock {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: var(--bind-top, 0px);
    z-index: 40;
    display: none;
    flex-direction: column;
    background: var(--panel-deep);
    border-top: 3px solid var(--ink);
    min-height: 0;
  }
  #binding-dock.open { display: flex; }
  .bd-grip { flex: 0 0 6px; height: 6px; background: var(--ink); cursor: row-resize; transition: background .12s; }
  .bd-grip:hover, .bd-grip.dragging { background: var(--zombie); }
  .bd-head {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 3px solid var(--ink);
  }
  /* 头部按语义分 5 组（编辑 / 镜像 / 姿态 / 产出 / 保存），组间竖分隔线。
     组内 nowrap（组是整体，一起换行），组间可换行 —— 破坏性操作与常用操作
     不再平铺在一起抢视觉权重。 */
  .bd-head-group {
    display: flex; align-items: center; gap: 6px;
    flex: 0 0 auto; flex-wrap: nowrap;
    padding-left: 10px;
    border-left: 2px solid var(--ink);
  }
  .bd-head-group:first-of-type { border-left: none; padding-left: 0; }
  .bd-head-actions { margin-left: auto; }
  .bd-glabel {
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim); opacity: .7; white-space: nowrap;
  }
  .bd-toplabel { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  /* 破坏性操作（重置 / Detach）降级为次要样式，不与 Bind Skin 抢视觉权重 */
  .bd-btn.danger { border-color: #ff9d6e; color: #ff9d6e; opacity: .78; }
  .bd-btn.danger:hover { background: rgba(255,157,110,0.16); opacity: 1; }
  .bd-btn.bd-icon { padding: 4px 8px; font-weight: 700; }
  .bd-btn.bd-icon.active { background: var(--zombie); color: var(--ink); border-color: var(--zombie); }
  .bd-check-head { flex: 0 0 auto; }
  /* 常驻产出状态徽标：保存提示只活 2.6 秒，这个一直在 */
  .bd-badge { font-size: 10px; white-space: nowrap; }
  .bd-badge-warn { color: var(--warn); }
  .bd-badge-ok { color: var(--toxic); }
  /* 半径：滑块粗调 + 数字框精调，两者双向同步 */
  .bd-rctl { display: flex; align-items: center; gap: 6px; }
  .bd-rctl input[type=range] { flex: 1 1 auto; min-width: 0; }
  .bd-num {
    flex: 0 0 62px; width: 62px; padding: 2px 4px;
    background: var(--panel-deep); color: var(--paper);
    border: 2px solid var(--ink); border-radius: 4px;
    font-size: 11px; font-family: inherit;
  }
  .bd-tip-inline { border-top: none; padding-top: 0; }
  .bd-title { font-weight: 700; font-size: 13px; color: var(--bone); white-space: nowrap; }
  .bd-title em { color: var(--zombie); font-style: normal; font-size: 11px; }
  .bd-model { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .bd-btn {
    flex: 0 0 auto;
    padding: 4px 10px;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .bd-btn:hover { background: var(--ink); color: var(--zombie); }
  .bd-btn.accent { border-color: var(--zombie); color: var(--zombie); }
  .bd-btn.accent:hover { background: var(--zombie); color: var(--ink); }
  .bd-btn:disabled { opacity: .4; cursor: not-allowed; }
  .bd-btn:disabled:hover { background: var(--panel-deep); color: var(--paper); }
  .bd-body { flex: 1 1 auto; display: flex; min-height: 0; }
  .bd-view { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: 6px; }
  .bd-vlabel { flex: 0 0 auto; font-size: 10px; color: var(--text-dim); padding: 0 0 4px 2px; }
  /* 正/侧视舞台：3D 正交层（.bd-gl）垫底，2D 骨架层（.bd-canvas）透明叠在上面。
     两层共用同一投影（见 BindingView3D.setFit），所以骨架与网格不会错位。 */
  .bd-stage {
    flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
    background: #0A0812; border: 2px solid var(--ink); border-radius: 4px;
  }
  .bd-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bd-stage .bd-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0;
    background: transparent; border: none; border-radius: 0;
  }
  .bd-canvas {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: block;
    background: #0A0812;
    border: 2px solid var(--ink);
    border-radius: 4px;
    touch-action: none; /* joint 拖拽自己接管 pointer 事件，别让浏览器抢去做滚动 */
  }
  .bd-side {
    flex: 0 0 250px;
    width: 250px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    overflow-y: auto;
    border-left: 2px solid var(--ink);
  }
  .bd-side::-webkit-scrollbar { width: 8px; }
  .bd-side::-webkit-scrollbar-thumb { background: var(--panel); border-radius: 4px; }
  .bd-info { font-size: 11px; line-height: 1.65; }
  /* 动画区：重定向诊断（片段名/帧数/最大对齐角/未匹配的骨） */
  .bd-anim {
    border-top: 2px solid var(--ink);
    padding-top: 6px;
    font-size: 10px;
    line-height: 1.7;
    color: var(--text-dim);
    word-break: break-word;
  }
  .bd-anim b { color: var(--paper); }
  .bd-anim .bd-row { font-size: 10px; }
  .bd-sel { font-weight: 700; font-size: 12px; color: var(--warn); margin-bottom: 4px; }
  .bd-mir { color: var(--text-dim); font-weight: 400; font-size: 10px; }
  .bd-row { display: flex; justify-content: space-between; gap: 8px; }
  .bd-row span { color: var(--text-dim); }
  .bd-row i { font-style: normal; font-size: 9px; opacity: .75; }
  .bd-ok { color: var(--zombie); }
  .bd-warn { color: var(--warn); }
  .bd-dim { color: var(--text-dim); }
  .bd-legend { border-top: 2px solid var(--ink); padding-top: 6px; font-size: 10px; color: var(--text-dim); }
  .bd-legend-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .bd-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
  .bd-dot-mid { background: #9BE7A8; }
  .bd-dot-left { background: #6FB7FF; }
  .bd-dot-right { background: #FF8FA3; }
  .bd-tip { border-top: 2px solid var(--ink); padding-top: 6px; font-size: 10px; color: var(--text-dim); line-height: 1.7; }
  .bd-tip b { color: var(--paper); }
  /* 侧栏表单字段（姿态预览 / 骨骼显示 / 权重优化） */
  .bd-field { display: flex; flex-direction: column; gap: 4px; }
  .bd-field > label { font-size: 10px; color: var(--text-dim); }
  .bd-pov { display: flex; gap: 4px; }
  .bd-pov button {
    flex: 1 1 0;
    padding: 4px 0;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }
  .bd-pov button:hover { background: var(--ink); color: var(--zombie); }
  .bd-pov button.active { background: var(--zombie); color: var(--ink); border-color: var(--zombie); }
  .bd-select {
    padding: 3px 6px;
    background: var(--panel-deep);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px;
    font-size: 11px;
    font-family: inherit;
  }
  .bd-check { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); cursor: pointer; }
  .bd-check input { accent-color: var(--zombie); }
